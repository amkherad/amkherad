career-profile:
    title: Career Profile
    summary: |
      I'm a software engineer with 10+ years of professional experience.
      I learned to program when I was 15, and it became my greatest passion ever since.

      I have profound knowledge of the web and its distributed nature and on the other hand I'm knowledgeable when it comes to low level stuff such as kernel programming, writing compilers (around 20 compilers / interpreters / transpilers), memory management, critical data-sharing, code optimizations.

      I write clean, testable, and reusable code, and I follow established programming principles and design patterns so others can read it easily.

      Technical Skills  
      - Languages: C#, Java, JavaScript, TypeScript, Python, SQL  
      - Backend: ASP.NET, Express.js, NestJS, FastAPI, Django  
      - Frontend & Mobile: React, React Native, Vue.js  
      - Databases: PostgreSQL, MS SQL Server, SQLite, Redis, MongoDB, DynamoDB  
      - Data Access: Entity Framework, Dapper, Sequelize, TypeORM, SQLAlchemy  
      - Architecture: Microservices, Domain-driven Design, Cell-based Architecture, SOLID, Design Patterns, Clean Architecture  
      - Communication: REST, GraphQL, gRPC, RabbitMQ, Kafka, Azure Service Bus, D-Bus  
      - Infrastructure: Docker, Kubernetes, CI/CD, AWS, Azure  
education:
    title: Education
    info:
      - degree: MSc in Computer Software Engineering
        university: Payame Noor University (Distance Education)
        time: 2019 – 2021
      - degree: BSc in Computer Programming
        university: University of Applied Science and Technology (Iran)
        time: 2016 – 2018
        details: |
          I've worked on many projects for my courses such as three languages, an interpreter as my final thesis, a compiler to generate AMD64 instructions, and a compiler+vm to compile and execute an intermediate language.

          My final project was on static & dynamic analysis, so I wrote an interpreted language to implement the ideas introduced in my project.
experiences:
    title: Experiences
    info:
      - role: Software Architect and Tech Lead
        time: May 2024 – Jun 2026 (2 yrs 2 mos)
        company: TopTec, Iran
        details: |
          TopTec is a ModiranKhodro sister company that builds software for its holding.

            - Built an identity server on OpenIddict with OAuth, OpenID Connect, LDAP and Kerberos sign-in, and federation to external identity providers.
            - Migrated the legacy token structure to encrypted JWTs carrying the claims needed for federation and ABAC.
            - Developed the organization's accounting system, compatible with SAP and other major systems, designed for millions of documents.
            - Made accounting-document ingestion idempotent with a SHA-256 deduplication key and a unique filtered index in MS SQL Server.
            - Built an S3/MinIO object storage service with presigned URLs and Object Lock retention, validating uploads by file signature.
            - Built a message-sender service with a persisted outbox and retries, delivering via in-app streams, SMS and Telegram.
            - Moved large Excel reports to an asynchronous queue and added server-side pagination for general-ledger reports.
            - Coached team members on AI-ready development.
      - role: Software Architect, then CTO
        time: May 2022 – 2024 (2 yrs)
        company: MateMachine, Vancouver (Hybrid)
        details: |
          MateMachine is an online dating platform. When I joined, the team had a monolithic MVP with significant bugs and performance issues, so I led a gradual move to microservices without a big-bang rewrite.

            - Built an identity server to centralize identity and enable OAuth in the app.
            - Extracted modules from the monolith into stand-alone services behind the same interfaces.
            - Managed the engineering team and designed the infrastructure and platform.
            - Migrated services from Azure to on-premise Hetzner servers to cut costs, and moved the front-end to Cloudflare edge hosting.
            - Built versioning for Docker, NuGet and Dart packages to avoid dependency hell.
            - Built a pipeline that publishes project docs to Confluence and a documentation site linking Swagger endpoints.
            - Secured the project with multiple techniques and ran security reviews with external experts and AI.
            - Improved the CI/CD pipelines and SDLC.
            - Used Datadog for monitoring.
      - role: Software Architect and Tech Lead
        time: May 2021 – Sep 2022 (1 yr 5 mos)
        company: Mores Software, Tehran
        details: |
          I was tech lead on an SCM system for industry-level supply chains, built as distributed microservices with micro-frontends. Stack: ASP.NET, Vue.js, PostgreSQL, DynamoDB, SQS, Kinesis and CloudWatch.

            - Taught the team segregation and SOLID principles while maintaining performance.
            - Built an integration testing framework with Testcontainers and Respawn, keeping tests isolated and fast.
            - Designed a cancellation and retry framework for front-end and back-end tasks, with tracking in the UI.
      - role: Backend Developer
        time: Nov 2020 – May 2021 (7 mos)
        company: Daroopin, Tehran
        details: |
          When I joined, everything was at MVP stage, so we re-designed and re-implemented the code for stability and maintainability.

            - Built "Shamim Pharmacy", an app for pharmacy owners, and then used its architecture for the main website.
            - Introduced the idea of a unified identity server to identify and track users.
            - Re-implemented the main website on microservices and event-sourced architectures.
      - role: Backend Developer
        time: Sep 2019 – May 2021 (1 yr 9 mos)
        company: AratelVC, Tehran
        details: |
          I was a back-end developer on a game, working on in-game match-making, actors and distributed locks.

            - Match-making by level, tier and win/lose rate.
            - An in-house advertising system to promote other projects such as Daroopin.
            - A multi-source payment system for Gems, Coins and Avatars.
            - Graceful handling of user disconnection and failures in TCP keep-alive handshakes.
            - Multiple-granularity locking.
      - role: C#/Java Developer
        time: Sep 2016 – Sep 2017 (1 yr 1 mo)
        company: Behineh Pardazesh, Tehran
        details: |
          A subsidiary of TCI (Telecommunication Company of Iran). Most work was done the old-fashioned way; I kept a modern design for the API layer I owned.

            - An API layer exposing MS SQL Server stored procedures over HTTP and SOAP, with multi-level and role-based auth, caching and aggregation.
            - An Android app for buying internet packages, paying bills and more.
            - A dynamic reporting system for other applications in the company.
      - role: Full Stack Developer
        time: Jun 2014 – Feb 2016 (1 yr 9 mos)
        company: Sibe Sabz Pishro Salamat, Tehran
        details: |
          We designed many applications, using a range of libraries and architectures to build maintainable software.
      - role: Software Developer
        time: May 2014 – Jan 2015 (9 mos)
        company: Arsin Index Computer, Tehran
        details: |
          During my BSc, my colleagues and I built an AI automation system for employees and their cars, then founded a company to sell it.

            - Written in C# for Windows as a plugin-based app, with a message bus (Signal Hub, inspired by Qt) and a plugin API.
            - A watchdog that recovers from crashes, with fallback options so a bad configuration cannot crash the software repeatedly.
            - License-plate recognition for any plate type, added through add-ons.
            - Video input for analog (VLC) and IP/RTSP (EmguCV) sources.
            - Communication with in-house hardware components.
      - role: Web Developer
        time: 2008 – 2011 (3 yrs)
        company: Lifecup
        details: |
            - Managed the network configuration, with help from the company's network engineer.
            - Did a lot of Photoshop retouching.
            - Started front-end work around age 15 with HTML and CSS, then JavaScript, designing websites and CMS themes.

