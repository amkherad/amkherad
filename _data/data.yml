career-profile:
    title: Career Profile
    summary: |
      I'm a software engineer with 10+ years of working experience.
      I learned to program when I was 15, and it became my greatest passion ever since.

      I have profound knowledge of the web and its distributed nature and on the other hand I'm knowledgeable when it comes to low level stuff such as kernel programming, writing compilers (around 20 compilers / interpreters / transpilers), memory management, critical data-sharing, code optimizations.

      I write clean, testable, and reusable code, and I follow established programming principles and design patterns so others can read it easily.

      Technical Skills  
      - Languages: C#, JavaScript, TypeScript, Python, SQL  
      - Backend: ASP.NET, Express.js, NestJS, FastAPI, Django  
      - Frontend & Mobile: React, React Native, Vue.js  
      - Databases: PostgreSQL, MSSQL, SQLite, Redis, MongoDB, DynamoDB  
      - Data Access: Entity Framework, Dapper, Sequelize, TypeORM, SQLAlchemy  
      - Architecture: Microservices, Domain-driven Design, Cell-based Architecture, SOLID, Design Patterns, Clean Architecture  
      - Communication: REST, GraphQL, gRPC, RabbitMQ, D-Bus  
      - Infrastructure: Docker, Kubernetes, CI/CD, AWS, Azure  
      - Tools: Git, GitHub, GitLab, Jira, Redmine  
      - Methodologies: Agile, Scrum
education:
    title: Education
    info:
      - degree: MSc in Computer Software Engineering
        university: Payame Noor University (Distance Education)
        time: 2019 – 2021
      - degree: BSc in Computer Programming
        university: University of Applied Science and Technology (Iran)
        time: 2016 – 2018
        details: |
          I've worked on many projects for my courses such as three languages, an interpreter as my final thesis, a compiler to generate AMD64 instructions, and a compiler+vm to compile and execute an intermediate language.

          My final project was on static & dynamic analysis, so I wrote an interpreted language to implement the ideas introduced in my project.
experiences:
    title: Experiences
    info:
      - role: Software Architect and Tech Lead
        time: May 2024 – 2026 (2 yr)
        company: TopTec, Iran
        details: |
          TopTec is a software company, a sister company of ModiranKhodro, that develops software used by other companies in the same holding

            - Developed an identity server using OpenIddict that supports OAuth, OpenID Connect and federated identity servers, connected to the organization's LDAP and Kerberos for unified logins.
            - Migrated the legacy token structure to modern encrypted JWTs carrying enough data to support federation, ABAC and other requirements.
            - Developed the organization's financial (accounting) system, compatible with major accounting systems including SAP, and designed it to handle millions of accounting documents and articles without degrading.
            - Coached team members on both technical topics and AI-ready development.
            - Improved pipelines to run integration and unit tests, improving the quality of service.
            - Built the identity server (STS) on OpenIddict with authorization code, client credentials and refresh-token flows, plus custom LDAP and token-exchange grants.
            - Implemented LDAP sign-in as a custom grant that binds as the user's directory entry and uses the directory objectGUID as the subject.
            - Added federation to external OpenID Connect identity providers, enabled by configuration.
            - Built a message-sender service with a persisted outbox, batched background dispatch and retries, delivering through in-app real-time streams, SMS and Telegram, with Liquid templates.
            - Generated one-time codes with a cryptographically secure random generator and a five-minute expiry.
            - Built an object storage service on S3/MinIO with presigned download URLs and S3 Object Lock retention (governance mode, indefinite or timed).
            - Validated uploads by file signature (magic bytes) against the declared content type, with a tracked upload pipeline (uploading, uploaded, failed).
            - Made accounting-document ingestion idempotent: a SHA-256 deduplication key over source system, source key and company, enforced by a unique filtered index in SQL Server.
            - Moved large Excel reports to an asynchronous request queue and added server-side pagination for general-ledger reports.
      - role: Software Architect, then CTO
        time: May 2022 – 2024 (2 yr)
        company: MateMachine, Vancouver (Hybrid)
        details: |
          MateMachine is an online dating platform with the goal of putting different models of match making together.
          When I joined, the team had a monolithic MVP with significant bugs and performance issues. I led a gradual transition to microservices without a big-bang rewrite, adding tests to the new parts from the start.

            - Built an identity server to delegate all the work related to identity to an unified service and enabled OAuth features in the app.
            - Led the team to extract simpler modules in the monolith to stand-alone services while keeping the same interfaces in the monolith.
            - Managed the engineering team and designed the infrastructure and platform.
            - Migrated services from Azure to on-premise infrastructure at Hetzner to cut costs.
            - Moved the front-end to edge static hosting on Cloudflare.
            - Built a sensible versioning for our packages (i.e. Docker, NuGet, Dart) to avoid dependency-hells.
            - Built a pipeline tool that publishes project /docs markdown to Confluence and a documentation site linking Swagger endpoints.
            - Built an advanced testing framework that runs integration and end-to-end tests in pipelines, and taught the team to write tests.
            - Secured the project with multiple techniques and ran security reviews with external experts and AI.
            - Improved the CI/CD pipelines and SDLC.
      - role: Back End Developer
        time: May 2021 – Sep 2022 (1 yr 5 mos)
        company: Mores software, Tehran
        details: |
          I worked as team lead on an SCM software to handle every aspect of industry-level supply chains. The stack consisted of ASP.NET, Vue.js, PostgreSQL, DynamoDB, SQS, Kinesis, CloudWatch with distributed microservices and microfrontends architectures.

            - Taught the team, how to achieve segregation and more generally to follow principles such as SOLID, while maintaining performance.
            - Implemented an integration testing framework to utilize Testcontainers and Respawn to allow for transient dependencies while remaining blazing fast.
            - Designed a framework to allow task control mechanisms like cancellation or retrying on front-end and back-end and enable tracking them in the UI (like JetBrains IDEs).
      - role: Back End Developer
        time: Nov 2020 – May 2021 (7 mos)
        company: Daroopin, Tehran
        details: |
          When I got into Daroopin everything was at the MVP stage, so we've done a lot of re-designs and re-implementations to achieve a stable, maintainable codebase.

            - The first thing I did in the company, was to implement an application for pharmacy owners called "Shamim Pharmacy". In the end, the application came out very well-designed so we wanted to have the same architecture for the main website.
            - After that, I introduced the idea of having a unified identity server so we could both identify and track our users more easily.
            - The most important thing was to re-implement the main website. We went for "Microservice application" and "Event-Sourced data" architectures.
      - role: Back End Developer
        time: Sep 2019 – May 2021 (1 yr 9 mos)
        company: AratelVC, Tehran
        details: |
          I worked as a back-end developer on a game at Aratel, including in-game match-making and using actors and distributed locks.

          Other experiences in this project were:
            - An in-house advertising system to advertise our other projects such as Daroopin.
            - A multi-source payment system to buy multiple currencies such as Gems, Coins, Avatars.
            - Graceful handling of user disconnection and failures in TCP keep-alive handshakes.
            - User match-making by multiple criteria, such as user's level, tier, win/lose rate.
            - Multiple-granularity locking.
      - role: C#/Java Developer
        time: Sep 2016 – Sep 2017 (1 yr 1 mo)
        company: Behineh Pardazesh, Tehran
        details: |
          The company was a subsidiary of TCI (Telecommunication Company of Iran).
          Everything was done the old-fashioned way; I maintained a modern design for the API layer I was in charge of.

          I worked on multiple projects in this company, which were:
            - An API layer for Stored-Procedure-based functions in MSSQL. which exposed both HTTP and SOAP endpoints for each public Stored-Procedure determined in an admin panel. It took care of the authentication/authorization (both multi-level auth and role-based auth), caching (if requested by the admin panel), aggregation, and so on.
            - An android application for buying internet packages, bill payment, and many more features.
            - A dynamic reporting system for other applications in the company.
      - role: Full Stack Developer
        time: Jun 2014 – Feb 2016 (1 yr 9 mos)
        company: Sibe Sabz Pishro Salamat, Tehran
        details: |
          We designed many applications, using a range of libraries and architectures to build maintainable software.
      - role: Software Developer
        time: May 2014 – Jan 2015 (9 mos)
        company: Arsin Index Computer, Tehran
        details: |
          During my BSc, my colleagues and I built an AI automation system for employees and their cars, then founded a company to sell it.

            - It was done in C# on windows.
            - Because if the software should crash, nothing was there to help the user, I implemented a watchdog to handle the crashes (with multiple fallback options to make sure the bad configuration wouldn't crash the software over and over again).
            - The software was highly modular and everything came as a plugin, so the main application was just a window with basics, a canvas in the middle for plugins to render their content, and a great API layer for plugins to use.
            - Implemented a message bus (Signal Hub, inspired by Qt).
            - The software would detect any type of license plate just by adding the right add-on for that kind of plaque.
            - I implemented a structure for video input to support both analog input (using VLC) and IP/RTSP input (using EmguCV).
            - We had a lot of physical components (which our hardware designer-made) that the software could communicate with.
      - role: Web Developer
        time: 2008 – 2011 (3 yrs)
        company: Lifecup
        details: |
            - I was in charge of the network configurations (the company had a network guy, but I did all the stuff with his help)
            - I also did a lot of photoshop retouching.
            - I started to do front-end (I was around 15), first I only did HTML and CSS, but after about a year forward I started to learn JS as well. I designed a lot of websites and made a lot of themes for various CMSes.

